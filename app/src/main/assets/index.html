<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Game Launcher</title>
<style>
:root{color-scheme:dark;--bg:#0c141c;--line:#24394a;--text:#e9f2f9;--mut:#8ea6b8;--acc:#1b9dff;--acc2:#67c1f5;--gold:#ffd25e;--play:#1b9dff;--sel:#67c1f5;--card:#1c3243;--pill:#223a4c;--selbg:#ffffff12;--trk:#ffffff22;--panel:#0f1a23;box-sizing:border-box;padding:max(env(safe-area-inset-top,0px),var(--st,0px)) max(env(safe-area-inset-right,0px),var(--sr,0px)) max(env(safe-area-inset-bottom,0px),var(--sb,0px)) max(env(safe-area-inset-left,0px),var(--sl,0px))}
:root.light{color-scheme:light;--text:#10202c;--mut:#4d6678;--line:#b6c6d2;--acc2:#0b78c9;--sel:#0b78c9;--gold:#b8860b;--card:#dbe5ec;--pill:#cfdbe4;--selbg:#00000014;--trk:#00000026;--panel:#f6f9fb}
*,*::before,*::after{box-sizing:inherit;margin:0}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{height:100%;overflow:hidden;color:var(--text);font:15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 18px}
.brand{font-weight:800;color:var(--acc2)}
.lt{display:flex;align-items:center;gap:4px}
.gear{display:grid;place-items:center;width:34px;height:34px;padding:0;background:none;border:0;border-radius:50%;color:var(--mut)}
.gear svg{width:22px;height:22px;fill:currentColor}
.gear:active{background:var(--selbg);color:var(--text)}
.hints u{text-decoration:none}
#bgimg{position:fixed;inset:0;z-index:-1;background:center/cover no-repeat}
#bgimg::after{content:"";position:absolute;inset:0;background:#0000006b}
/* settings */
#set{position:fixed;inset:0;z-index:7;display:flex;align-items:center;justify-content:center;background:#0009;padding:max(env(safe-area-inset-top,0px),var(--st,0px)) max(env(safe-area-inset-right,0px),var(--sr,0px)) max(env(safe-area-inset-bottom,0px),var(--sb,0px)) max(env(safe-area-inset-left,0px),var(--sl,0px))}
.sp{display:flex;flex-direction:column;width:min(calc(100% - 16px),780px);max-height:calc(100% - 16px);background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sh{display:flex;align-items:center;justify-content:space-between;padding:8px 14px;border-bottom:1px solid var(--line)}
.sh h2{font-size:1.05rem}
.x{padding:6px 14px}
.sb{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;padding:12px 14px;overflow-y:auto;scrollbar-width:none}
.sc{display:flex;flex-direction:column;gap:8px;min-width:0}
.sc h3{font-size:.82rem;color:var(--mut)}
.note{color:var(--mut);font-size:.8rem}
.sw{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.swt{width:34px;height:34px;justify-self:center;border-radius:50%;border:2px solid var(--line);padding:0}
.swt.on{border-color:var(--text);box-shadow:0 0 0 2px var(--acc)}
.sl{display:grid;gap:4px;font-size:.78rem;color:var(--mut)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;border-radius:9px;background:var(--trk);outline:0}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;border:3px solid var(--acc)}
#hh{background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.lg{display:flex;flex-direction:column;gap:6px}
.lb{text-align:left}
.lb.on{border-color:var(--acc2)}
.lb.on::after{content:" ✓"}
.btn:disabled{opacity:.4}
.fc{outline:3px solid var(--acc2);outline-offset:2px}
.tabs{display:flex;gap:2px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:6px 12px;color:var(--mut);font-weight:600}
.tab.on{color:var(--text);border-color:var(--acc)}
.status{display:flex;gap:12px;min-width:80px;justify-content:flex-end;color:var(--mut);font-size:.85rem}

/* icon grid: just the icon and its name, no card behind it */
main{flex:1;min-height:0;display:flex}
#list{flex:1;min-width:0;position:relative;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));grid-auto-rows:max-content;align-content:start;gap:6px;padding:10px 14px;overflow-y:auto;scroll-behavior:smooth;scrollbar-width:none}
#list::-webkit-scrollbar{display:none}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0;padding:10px 4px 8px;background:none;border:2px solid transparent;border-radius:14px}
.tile img{display:block;width:60px;height:60px;border-radius:22%}
.tile span{max-width:100%;font-size:.75rem;color:var(--mut);overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.tile.sel{background:var(--selbg);border-color:var(--sel)}
.tile img{transition:transform .15s}
.tile.sel img{transform:scale(1.16)}
.tg{display:flex;flex-wrap:wrap;gap:6px}
.ch{flex:1;padding:6px 8px;font-size:.78rem}
.ch.on,.so.on{border-color:var(--acc2)}
.sn{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.so{padding:7px 8px;font-size:.8rem;text-align:left}
.so.on::after{content:" ✓"}
.tile.sel span{color:var(--text)}
.st{position:absolute;top:4px;right:8px;font-style:normal;font-size:.8rem;color:var(--gold)}
.empty{grid-column:1/-1;justify-self:center;padding:24px;color:var(--mut);text-align:center;max-width:34ch}

/* right panel */
#detail{width:min(32%,280px);flex:none;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:12px 22px 12px 8px}
#di{display:block;width:64px;height:64px;border-radius:22%}
#t{font-size:1.4rem;font-weight:800;line-height:1.1;overflow-wrap:anywhere}
#m{color:var(--mut);font-size:.88rem;margin-top:4px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:10px 14px;font-weight:600}
.btn.go{background:var(--play);border-color:var(--play);color:var(--playt,#fff);font-weight:800;padding:13px 14px;font-size:1.05rem}
.row{display:flex;gap:8px}.row .btn{flex:1}

/* bottom hints */
.hints{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 18px;padding:5px 16px;color:var(--mut);font-size:.74rem}
.hints b{display:inline-block;min-width:1.6em;padding:0 6px;margin-right:4px;border-radius:99px;background:var(--pill);color:var(--text);text-align:center}

/* launching screen: plain background, icon and name only */
#ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:5;background:var(--bg)}
#ov.on{display:flex}
#oi{width:84px;border-radius:22%}
#ot{font-size:1.6rem;font-weight:800}
.bar{width:min(50vw,300px);height:6px;border-radius:9px;background:var(--trk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc2);animation:fill .9s linear forwards}
@keyframes fill{from{width:0}to{width:100%}}
#toast{color:#fff;position:fixed;left:50%;bottom:40px;transform:translateX(-50%);max-width:86vw;text-align:center;background:#000c;border:1px solid var(--line);padding:8px 16px;border-radius:8px;font-size:.85rem;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
#toast.on{opacity:1}
@media(prefers-reduced-motion:reduce){#list{scroll-behavior:auto}#toast{transition:none}.tile img{transition:none}.bar i{animation-duration:.01s}}
</style>
</head>

const tr=(k,...a)=>{const d=T[S.cfg.lang]||T.en,v=d[k]!=null?d[k]:T.en[k];return typeof v=='function'?v(...a):v};
const hx=n=>Math.round(n).toString(16).padStart(2,'0');
function hsv2hex(h,s,v){s/=100;v/=100;const f=n=>{const k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1))};return '#'+hx(f(5)*255)+hx(f(3)*255)+hx(f(1)*255)}
function hex2hsv(c){const r=parseInt(c.slice(1,3),16)/255,g=parseInt(c.slice(3,5),16)/255,b=parseInt(c.slice(5,7),16)/255,mx=Math.max(r,g,b),d=mx-Math.min(r,g,b);let h=0;if(d){h=mx==r?((g-b)/d)%6:mx==g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}return[Math.round(h),Math.round(mx?d/mx*100:0),Math.round(mx*100)]}
function lum(c){const v=[1,3,5].map(k=>{const x=parseInt(c.slice(k,k+2),16)/255;return x<=.03928?x/12.92:Math.pow((x+.055)/1.055,2.4)});return .2126*v[0]+.7152*v[1]+.0722*v[2]}
// the app reports the camera cutout size (in px) so content stays clear of it
window.setInsets=(l,t,r,b)=>{const s=document.documentElement.style;s.setProperty('--sl',l+'px');s.setProperty('--st',t+'px');s.setProperty('--sr',r+'px');s.setProperty('--sb',b+'px')};
let A=[],ready=false,tab=0,i=0,timer=null,S={fav:[],add:[],hide:[],last:{}};
try{Object.assign(S,JSON.parse(localStorage.getItem('gl')||'{}'))}catch(e){}
const SND=['Soft Keycap','Muted Linear','Tactile Bump','Low Thock','Crisp Switch','Rubber Dome','Double Tap','Desk Button','Soft Pop','Quiet Click','Premium Key'];
S.cfg=Object.assign({lang:'en',bg:'#0c141c',snd:0,play:null,sel:null},S.cfg);
if(!T[S.cfg.lang])S.cfg.lang='en';
const okc=c=>/^#[0-9a-f]{6}$/i.test(c);
if(!okc(S.cfg.bg))S.cfg.bg='#0c141c';
['play','sel'].forEach(k=>{if(!okc(S.cfg[k]))S.cfg[k]=null});
if(!(S.cfg.snd>=-1&&S.cfg.snd<SND.length))S.cfg.snd=0;
let bgData='',tgt='bg',hsv=hex2hsv(S.cfg.bg),nav=false,sfi=0;
const save=()=>{try{localStorage.setItem('gl',JSON.stringify(S))}catch(e){}};
const has=(k,p)=>S[k].includes(p);
// Games = apps Android marks as games, plus any app the person adds from All apps
const isG=a=>(a.g||has('add',a.p))&&!has('hide',a.p);
const esc=s=>s.replace(/[&<>"]/g,c=>'&#'+c.charCodeAt(0)+';');
const ago=t=>{if(!t)return tr('never');const m=Math.round((Date.now()-t)/6e4);return m<1?tr('now'):m<60?tr('min',m):m<1440?tr('hr',Math.round(m/60)):tr('day',Math.round(m/1440))};
const list=()=>tab==0?A.filter(isG).sort((x,y)=>(S.last[y.p]||0)-(S.last[x.p]||0)).slice(0,8):tab==1?A.filter(isG):tab==2?A.filter(a=>has('fav',a.p)):A.filter(a=>!isG(a));
const empty=()=>tr(!window.Android?'eopen':!ready?'escan':tab==2?'efav':tab==3?'eall':'egames');

function scan(){
  try{A=window.Android?JSON.parse(Android.apps()):[]}catch(e){A=[]}
  A.sort((x,y)=>x.n.localeCompare(y.n));ready=true;build();
}
// full redraw: only when the tab or the list itself changes
function build(){
  const L=list();if(i>=L.length)i=Math.max(0,L.length-1);
  document.querySelectorAll('.tab').forEach((b,k)=>b.classList.toggle('on',k==tab));
  const el=$('#list');
  el.innerHTML=L.length?L.map((a,k)=>`<button class="tile" data-k="${k}" tabindex="-1"><img src="${a.i}" alt=""><span>${esc(a.n)}</span><i class="st"${has('fav',a.p)?'':' hidden'}>★</i></button>`).join(''):`<p class="empty">${empty()}</p>`;
  el.style.scrollBehavior='auto';el.scrollTop=0;el.style.scrollBehavior='';
  paint();
}
// light update: move the highlight and refresh the right panel
function paint(){
  const L=list(),a=L[i];
  document.querySelectorAll('.tile').forEach((t,k)=>t.classList.toggle('sel',k==i));
  $('#detail').hidden=!a;
  if(a){
    $('#di').src=a.i;$('#t').textContent=a.n;
    $('#m').textContent=tab==3?tr('notlib'):ago(S.last[a.p]);
    $('#play').textContent=tr(tab==3?'add':'play');$('#row').hidden=tab==3;
    $('#fav').textContent=tr(has('fav',a.p)?'faved':'fav');
  }
  fit();
}
// keep the selected icon on screen
function fit(){
  const el=$('#list'),t=el.querySelectorAll('.tile')[i];if(!t)return;
  const top=t.offsetTop-8,bot=t.offsetTop+t.offsetHeight+8;
  if(top<el.scrollTop)el.scrollTop=top;
  else if(bot>el.scrollTop+el.clientHeight)el.scrollTop=bot-el.clientHeight;
}
function toast(t,ms=2600){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>e.classList.remove('on'),ms)}
function stop(){clearTimeout(timer);timer=null;$('#ov').classList.remove('on')}
function play(){
  const a=list()[i];if(!a||timer)return;
  snd();
  if(tab==3){S.add.push(a.p);S.hide=S.hide.filter(x=>x!=a.p);save();toast(tr('added',a.n));return build()}
  const o=$('#ov');$('#oi').src=a.i;$('#ot').textContent=a.n;
  o.classList.remove('on');void o.offsetWidth;o.classList.add('on');
  S.last[a.p]=Date.now();save();
  timer=setTimeout(()=>{stop();if(window.Android)Android.launch(a.p);i=0;build()},900);
}
function act(a){
  if(timer){if(a=='back')stop();return}
  if(setOpen())return setAct(a);
  if(a=='set')return openSet();
  const L=list(),n=L.length,el=$('#list');
  const o=i,cols=Math.max(1,getComputedStyle(el).gridTemplateColumns.split(' ').length);
  if(a=='l')i=Math.max(0,i-1);
  else if(a=='r')i=Math.max(0,Math.min(n-1,i+1));
  else if(a=='u'){if(i-cols>=0)i-=cols}
  else if(a=='d'){if(i+cols<n)i+=cols;else if(n&&((i/cols)|0)<(((n-1)/cols)|0))i=n-1}
  else if(a=='ok')return play();
  else if(a=='fav'){
    const x=L[i];
    if(x&&tab<3){
      S.fav=has('fav',x.p)?S.fav.filter(p=>p!=x.p):[...S.fav,x.p];save();
      if(tab==2)return build();
      el.querySelectorAll('.tile')[i].querySelector('.st').hidden=!has('fav',x.p);
    }
  }
  else if(a=='tl'||a=='tr'){tab=(tab+(a=='tr'?1:3))%4;i=0;return build()}
  if(i!=o)snd();
  paint();
}
$('#list').addEventListener('click',e=>{const c=e.target.closest('.tile');if(!c)return;const k=+c.dataset.k;if(k==i)play();else{i=k;snd();paint()}});
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{tab=+b.dataset.t;i=0;build()});
$('#play').onclick=play;
// tap "Launcher" to see screen/cutout info
$('#brand').onclick=()=>{try{toast(Android.dbg(),9000)}catch(e){toast(tr('noinfo'))}};
$('#fav').onclick=()=>act('fav');
$('#del').onclick=()=>{const a=list()[i];if(!a)return;S.hide.push(a.p);S.add=S.add.filter(x=>x!=a.p);save();build()};
$('#ov').onclick=stop;
// keyboard (ignored while a controller is connected, so a pad never double-fires)
const gp=()=>navigator.getGamepads?[...navigator.getGamepads()].find(Boolean):null;
const km={ArrowLeft:'l',ArrowRight:'r',ArrowUp:'u',ArrowDown:'d',Enter:'ok',Escape:'back',Backspace:'back',f:'fav',y:'fav',q:'tl',e:'tr',s:'set'};
addEventListener('keydown',e=>{const a=km[e.key];if(a&&!gp()){e.preventDefault();act(a)}});
// controller: d-pad or left stick, A play, B back, Y favorite, bumpers switch tab
const pm={14:'l',15:'r',12:'u',13:'d',0:'ok',1:'back',3:'fav',4:'tl',5:'tr',9:'set'},rep={l:1,r:1,u:1,d:1};let hold={};
function poll(t){
  const p=gp(),on={};
  if(p){
    p.buttons.forEach((b,k)=>{if(b.pressed&&pm[k])on[pm[k]]=1});
    const x=p.axes[0]||0,y=p.axes[1]||0;
    if(x<-.6)on.l=1;if(x>.6)on.r=1;if(y<-.6)on.u=1;if(y>.6)on.d=1;
  }
  for(const a in on){
    if(!(a in hold)){hold[a]=t+300;act(a)}
    else if(rep[a]&&t>=hold[a]){hold[a]=t+110;act(a)}
  }
  for(const a in hold)if(!on[a])delete hold[a];
  requestAnimationFrame(poll);
}
requestAnimationFrame(poll);
const tick=()=>$('#clk').textContent=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
tick();setInterval(tick,15000);
try{if(navigator.getBattery)navigator.getBattery().then(b=>{const u=()=>$('#bat').textContent=Math.round(b.level*100)+'%'+(b.charging?' ⚡':'');u();b.onlevelchange=b.onchargingchange=u}).catch(()=>{})}catch(e){}
// ---- settings: background image, background color, language ----
const PAL={bg:['#0c141c','#000000','#1e1e24','#0b1d3a','#231942','#0f2a1d','#3a0f1a','#0b3a3a','#2b3440','#f2f5f7'],
  play:['#1b9dff','#22c55e','#ef4444','#f59e0b','#a855f7','#ec4899','#14b8a6','#f97316','#eab308','#ffffff'],
  sel:['#67c1f5','#ffffff','#ffd25e','#4ade80','#f87171','#c084fc','#f472b6','#2dd4bf','#fb923c','#1b9dff']};
const DEF={bg:'#0c141c',play:'#1b9dff',sel:'#67c1f5'};
const cur=t=>S.cfg[t]||DEF[t];
const snd=()=>{try{if(S.cfg.snd>=0)Android.click(S.cfg.snd)}catch(e){}};
function applyTheme(){
  const c=S.cfg.bg,r=document.documentElement,b=$('#bgimg');
  r.style.setProperty('--bg',c);
  r.classList.toggle('light',!bgData&&lum(c)>.22);
  b.style.backgroundImage=bgData?`url("${bgData}")`:'none';b.hidden=!bgData;
  ['play','sel'].forEach(k=>S.cfg[k]?r.style.setProperty('--'+k,S.cfg[k]):r.style.removeProperty('--'+k));
  r.style.setProperty('--playt',lum(cur('play'))>.22?'#10202c':'#fff');
  try{Android.setBgColor(c)}catch(e){}
}
function applyLang(){
  document.documentElement.lang=S.cfg.lang;
  document.querySelectorAll('[data-i]').forEach(e=>e.textContent=tr(e.dataset.i));
  $('#gear').title=tr('st');$('#gear').setAttribute('aria-label',tr('st'));
  build();if(setOpen())paintSet();
}
function loadBg(){try{bgData=window.Android?Android.bg():''}catch(e){bgData=''}applyTheme();if(setOpen())paintSet()}
window.bgPicked=loadBg;
window.bgFail=()=>toast(tr('imgerr'));
const setOpen=()=>!$('#set').hidden;
const sfs=()=>[...$('#set').querySelectorAll('.sf')].filter(e=>!e.disabled);
function mark(){const L=sfs();sfi=Math.max(0,Math.min(sfi,L.length-1));L.forEach((e,k)=>e.classList.toggle('fc',nav&&k==sfi));const e=L[sfi];if(nav&&e)e.scrollIntoView({block:'nearest'})}
function paintSet(){
  const c=cur(tgt).toLowerCase();
  $('#hh').value=hsv[0];$('#hs').value=hsv[1];$('#hv').value=hsv[2];
  $('#tg').innerHTML=[['bg','cbg'],['play','cplay'],['sel','csel']].map(([k,l])=>`<button class="btn ch sf${k==tgt?' on':''}" data-t="${k}">${tr(l)}</button>`).join('');
  $('#sw').innerHTML=PAL[tgt].map(x=>`<button class="swt sf${x==c?' on':''}" data-c="${x}" style="background:${x}" aria-label="${x}"></button>`).join('');
  $('#lg').innerHTML=LANGS.map(([k,n])=>`<button class="btn lb sf${k==S.cfg.lang?' on':''}" data-l="${k}">${n}</button>`).join('');
  $('#sn').innerHTML=[-1,...SND.keys()].map(k=>`<button class="btn so sf${k==S.cfg.snd?' on':''}" data-s="${k}">${k<0?tr('off'):(k+1)+' · '+SND[k]}</button>`).join('');
  $('#imgnote').textContent=tr(bgData?'hasimg':'noimg');
  $('#unpick').disabled=!bgData;
  mark();
}
function openSet(){if(timer)return;nav=false;sfi=0;$('#set').hidden=false;paintSet()}
function closeSet(){$('#set').hidden=true}
function setColor(c,fromHex){S.cfg[tgt]=c;if(fromHex)hsv=hex2hsv(cur(tgt));save();applyTheme();paintSet()}
// controller / keyboard inside the settings panel
function setAct(a){
  if(a=='back'||a=='set')return closeSet();
  if(!nav){nav=true;return mark()}
  const L=sfs(),e=L[sfi];if(!e)return;
  if(e.type=='range'&&(a=='l'||a=='r')){const st=e.id=='hh'?5:2;e.value=+e.value+(a=='r'?st:-st);e.dispatchEvent(new Event('input'));return}
  if(a=='ok'){if(e.type!='range')e.click();return}
  if(a=='l'||a=='u')sfi--;else if(a=='r'||a=='d')sfi++;
  mark();
}
$('#gear').onclick=openSet;
$('#sx').onclick=closeSet;
$('#set').addEventListener('click',e=>{if(e.target.id=='set')closeSet()});
$('#pick').onclick=()=>{try{Android.pickImage()}catch(e){toast(tr('imgerr'))}};
$('#unpick').onclick=()=>{try{Android.clearBg()}catch(e){}bgData='';applyTheme();paintSet()};
$('#sw').onclick=e=>{const b=e.target.closest('.swt');if(b)setColor(b.dataset.c,true)};
$('#lg').onclick=e=>{const b=e.target.closest('.lb');if(!b)return;S.cfg.lang=b.dataset.l;save();applyLang()};
$('#rc').onclick=()=>setColor(tgt=='bg'?DEF.bg:null,true);
$('#tg').onclick=e=>{const b=e.target.closest('.ch');if(!b)return;tgt=b.dataset.t;hsv=hex2hsv(cur(tgt));paintSet()};
$('#sn').onclick=e=>{const b=e.target.closest('.so');if(!b)return;S.cfg.snd=+b.dataset.s;save();paintSet();snd()};
['hh','hs','hv'].forEach(id=>$('#'+id).oninput=()=>{hsv=[+$('#hh').value,+$('#hs').value,+$('#hv').value];setColor(hsv2hex(hsv[0],hsv[1],hsv[2]),false)});
applyTheme();applyLang();setTimeout(loadBg,0);
requestAnimationFrame(()=>setTimeout(scan,50));
</script>
</body>
</html>
